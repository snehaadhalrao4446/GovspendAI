services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tourism
      POSTGRES_USER: tourism
      POSTGRES_PASSWORD: change-me-before-use
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tourism -d tourism"]
      interval: 5s
      timeout: 3s
      retries: 10
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: tourism-local
      MINIO_ROOT_PASSWORD: change-me-before-use
    ports:
      - "9000:9000"
      - "9001:9001"
